[project]
name = "robust-lit-review"
version = "0.1.0"
description = "World-class automated literature review pipeline using Scopus, PubMed, Embase, Unpaywall, and Zotero APIs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "bibtexparser>=1.4",
    "rich>=13.0",
    "typer>=0.12",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
semantic = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
lit-review = "litreview.cli:app"
evidence-brief-web = "litreview.web.app:main"
evidence-brief-worker = "litreview.web.relay:main"

[tool.setuptools.package-data]
"litreview.web" = ["static/*"]

[tool.pyright]
include = ["src/litreview/web"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
